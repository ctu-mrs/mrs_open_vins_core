# do not modify these
root: ./
name: simulation
socket_name: mrs
attach: false
tmux_options: -f /etc/ctu-mrs/tmux.conf
# you can modify these
startup_window: restarter
pre_window: export UAV_NAME=uav1; export USE_SIM_TIME="true"; export RMW_IMPLEMENTATION=rmw_zenoh_cpp
windows:
  - router:
      layout: tiled
      panes:
        - ros2 run rmw_zenoh_cpp rmw_zenohd
  - simulator:
      layout: tiled
      panes:
        - ros2 launch mrs_uav_flightforge_simulator flightforge_simulator.launch.py custom_config:=./config/simulator.yaml
  - hw_api:
      layout: tiled
      panes:
        - ros2 launch mrs_uav_flightforge_simulator hw_api.launch.py
  - vio_front:
      layout: even-horizontal
      panes:
        - ros2 launch mrs_open_vins_core open_vins.launch.py node_name_suffix:=_front config_path:=./config/open_vins_front/estimator_config.yaml
  - vio_back:
      layout: even-horizontal
      panes:
        - ros2 launch mrs_open_vins_core open_vins.launch.py node_name_suffix:=_back config_path:=./config/open_vins_back/estimator_config.yaml
  - restarter:
      layout: tiled
      panes:
        - ros2 launch open_vins_restarter restarter.launch.py
  - static_tf:
      layout: tiled
      panes:
        - ros2 launch ./config/static_tfs.yaml
  - status:
      layout: tiled
      panes:
        - ros2 run mrs_uav_status status.sh
  - core:
      layout: tiled
      panes:
        - ros2 launch mrs_uav_core core.launch.py platform_config:=./config/platform_config.yaml world_config:=./config/world_config.yaml custom_config:=./config/custom_config.yaml network_config:=./config/network_config.yaml
  - takeoff:
      layout: tiled
      panes:
        - ros2 launch mrs_uav_autostart automatic_start.launch.py custom_config:=./config/automatic_start.yaml
  - commands:
      layout: tiled
      panes:
        - waitForCore; ./takeoff.sh
  - rviz:
      layout: tiled
      panes:
        - ros2 run rviz2 rviz2 -d ./rviz.rviz --ros-args -p use_sim_time:=true
  # - reconfigure:
  #     layaut: tiled
  #     panes:
  #       - ros2 run rqt_reconfigure rqt_reconfigure
  - layout:
      layout: tiled
      panes:
        - sleep 5; ~/.i3/layout_manager.sh ./layout.json
